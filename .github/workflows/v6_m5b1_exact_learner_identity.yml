name: V6 M5B1 exact learner identity

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v6_m5b1_exact_learner_identity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  identity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pandas==2.2.3 pyarrow==17.0.0
      - name: Acquire exact annotation source
        run: |
          set -euo pipefail
          mkdir -p v6_m5b1_work v6_m5b1_out
          curl --fail --location --retry 5 --retry-delay 5 -o v6_m5b1_work/body-annotations.feather https://storage.googleapis.com/flyem-male-cns/v1.0/connectome-data/flat-connectome/body-annotations-male-cns-v1.0-minconf-0.5.feather
          echo '2177e246113e4cfbf1e7772ec37c6da1955ff22e8063d0b1f833101f99a9a3b2  v6_m5b1_work/body-annotations.feather' | sha256sum -c -
      - name: Freeze execution bytes
        run: sha256sum research/v6_m5b1_exact_learner_identity_protocol.md fly_mnq/v6_m5b1_exact_learner_identity.py | tee v6_m5b1_out/preexecution_sha256.txt
      - name: Execute identity gate
        run: python fly_mnq/v6_m5b1_exact_learner_identity.py | tee v6_m5b1_out/stdout.txt
      - name: Hash outputs
        if: always()
        run: sha256sum v6_m5b1_out/v6_m5b1_exact_learner_identity_result.json v6_m5b1_out/stdout.txt v6_m5b1_out/preexecution_sha256.txt | tee v6_m5b1_out/output_sha256.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fly-mnq-v6-m5b1-exact-learner-identity
          path: v6_m5b1_out/
          retention-days: 14
          compression-level: 0
