name: Homelander P1 v005 DualEye Render CI

on:
  push:
    branches:
      - homelander-p1-v005-laser-render-20260918
    paths:
      - 'homelander_p1_build/homelander_p1.cpp'
      - 'homelander_p1_build/lua_p1/eye_origin_probe_v006_STAGED.lua'
      - 'homelander_p1_build/lua_p1/dual_eye_freeaim_render_v007_STAGED.lua'
      - 'homelander_p1_build/P1_DUALEYE_FREEAIM_RENDER_GATE_20260918.md'
      - '.github/workflows/homelander-p1-v005-dualeye-render-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-static-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Win32 and Lua 5.1 tools
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-mingw-w64-i686 binutils-mingw-w64-i686 lua5.1

      - name: Build v005
        run: |
          mkdir -p homelander_p1_build/build_v005
          i686-w64-mingw32-g++ homelander_p1_build/homelander_p1.cpp \
            -std=gnu++17 -O2 -Wall -Wextra \
            -shared -static-libgcc -static-libstdc++ \
            -Wl,--subsystem,windows \
            -o homelander_p1_build/build_v005/homelander_p1_v005.asi \
            -luser32
          test -s homelander_p1_build/build_v005/homelander_p1_v005.asi

      - name: Verify PE32 imports and gate dispatch
        run: |
          file homelander_p1_build/build_v005/homelander_p1_v005.asi | tee homelander_p1_build/build_v005/file.txt
          i686-w64-mingw32-objdump -f homelander_p1_build/build_v005/homelander_p1_v005.asi | tee homelander_p1_build/build_v005/headers.txt
          i686-w64-mingw32-objdump -p homelander_p1_build/build_v005/homelander_p1_v005.asi | tee homelander_p1_build/build_v005/imports.txt
          grep -Eiq 'pei-i386|i386' homelander_p1_build/build_v005/headers.txt
          if grep -Eiq 'libstdc\+\+-6\.dll|libgcc_s_.*\.dll|libwinpthread-1\.dll' homelander_p1_build/build_v005/imports.txt; then exit 1; fi
          grep -q 'P1_RuntimeProbe_005_DUALEYE_RENDER_STAGED_20260918' homelander_p1_build/homelander_p1.cpp
          grep -q 'VK_F11' homelander_p1_build/homelander_p1.cpp
          grep -q 'VK_F12' homelander_p1_build/homelander_p1.cpp
          grep -q 'Homelander_EyeOriginProbeV006' homelander_p1_build/homelander_p1.cpp
          grep -q 'Homelander_DualEyeFreeAimRenderProbe' homelander_p1_build/homelander_p1.cpp

      - name: Validate Lua 5.1 and coordinate-space invariants
        run: |
          LUAC="$(command -v luac5.1 || command -v luac)"
          "$LUAC" -p homelander_p1_build/lua_p1/freeaim_probe_v004_STAGED.lua
          "$LUAC" -p homelander_p1_build/lua_p1/freeaim_local_offset_probe_v005_STAGED.lua
          "$LUAC" -p homelander_p1_build/lua_p1/eye_origin_probe_v006_STAGED.lua
          "$LUAC" -p homelander_p1_build/lua_p1/dual_eye_freeaim_render_v007_STAGED.lua
          grep -q 'local targetJoint = ""' homelander_p1_build/lua_p1/dual_eye_freeaim_render_v007_STAGED.lua
          grep -q 'HOMELANDER_FREEAIM_TARGET_LOCAL_OFFSET_GOH' homelander_p1_build/lua_p1/dual_eye_freeaim_render_v007_STAGED.lua
          if grep -Eq 'go_ApplyDamage|go_ApplyDamageAndHit|em_AddWorldEffect|em_AddWorldEffectOriented' homelander_p1_build/lua_p1/dual_eye_freeaim_render_v007_STAGED.lua; then
            echo "Forbidden damage/world-effect mutation in render-only gate"
            exit 1
          fi

      - name: Hash build and scripts
        run: |
          sha256sum homelander_p1_build/build_v005/homelander_p1_v005.asi | tee homelander_p1_build/build_v005/sha256.txt
          sha256sum homelander_p1_build/lua_p1/eye_origin_probe_v006_STAGED.lua
          sha256sum homelander_p1_build/lua_p1/dual_eye_freeaim_render_v007_STAGED.lua

      - name: Assemble dormant v005 bundle
        run: |
          mkdir -p stage_v005/lua_p1 stage_v005/CI_EVIDENCE
          cp homelander_p1_build/build_v005/homelander_p1_v005.asi stage_v005/
          cp homelander_p1_build/lua_p1/eye_origin_probe_v006_STAGED.lua stage_v005/lua_p1/
          cp homelander_p1_build/lua_p1/dual_eye_freeaim_render_v007_STAGED.lua stage_v005/lua_p1/
          cp homelander_p1_build/P1_DUALEYE_FREEAIM_RENDER_GATE_20260918.md stage_v005/
          cp homelander_p1_build/homelander_p1.cpp stage_v005/homelander_p1_v005_SOURCE.cpp
          cp homelander_p1_build/build_v005/file.txt stage_v005/CI_EVIDENCE/
          cp homelander_p1_build/build_v005/headers.txt stage_v005/CI_EVIDENCE/
          cp homelander_p1_build/build_v005/imports.txt stage_v005/CI_EVIDENCE/
          cp homelander_p1_build/build_v005/sha256.txt stage_v005/CI_EVIDENCE/
          (cd stage_v005 && sha256sum homelander_p1_v005.asi lua_p1/*.lua P1_DUALEYE_FREEAIM_RENDER_GATE_20260918.md homelander_p1_v005_SOURCE.cpp > SHA256SUMS.txt)
          (cd stage_v005 && sha256sum -c SHA256SUMS.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: Homelander_P1_v005_DualEyeRenderGate_DORMANT
          path: stage_v005/
          if-no-files-found: error
