name: FLY-MNQ V6-M3A2 main-component morphology audit

on:
  push:
    branches: [main]
    paths:
      - 'research/v6_m3a2_preexisting_main_component_morphology_protocol.md'
      - 'fly_mnq/v6_m3a2_main_component_morphology_audit.py'
      - '.github/workflows/fly_mnq_v6_m3a2_main_component_morphology_audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - name: Install frozen dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.1.3 pandas==2.2.3 pyarrow==17.0.0 scipy==1.14.1
      - name: Acquire exact official sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p v6_m3a2_work v6_m3a2_out
          curl --fail --location --retry 5 --retry-delay 3 -o v6_m3a2_work/brain.npz             https://github.com/alextitonis/fly.ai/releases/download/brain-v1/brain.npz
          curl --fail --location --retry 5 --retry-delay 3 -o v6_m3a2_work/syn-partners.feather             https://storage.googleapis.com/flyem-male-cns/v1.0/connectome-data/flat-connectome/syn-partners-male-cns-v1.0-minconf-0.5.feather
          for body in 10540 10977; do
            curl --fail --location --retry 5 --retry-delay 3 -o "v6_m3a2_work/$body.swc"               "https://storage.googleapis.com/flyem-male-cns/v1.0/segmentation/skeletons-malecns/skeletons-swc/$body.swc"
          done
          sha256sum v6_m3a2_work/brain.npz v6_m3a2_work/syn-partners.feather v6_m3a2_work/10540.swc v6_m3a2_work/10977.swc | tee v6_m3a2_out/input_sha256.txt
      - name: Freeze execution bytes
        shell: bash
        run: |
          set -euo pipefail
          sha256sum research/v6_m3a2_preexisting_main_component_morphology_protocol.md fly_mnq/v6_m3a2_main_component_morphology_audit.py | tee v6_m3a2_out/preexecution_sha256.txt
      - name: Execute source-only morphology audit
        shell: bash
        run: |
          set -o pipefail
          python fly_mnq/v6_m3a2_main_component_morphology_audit.py | tee v6_m3a2_out/stdout.txt
      - name: Enforce formal PASS
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          r=json.load(open('v6_m3a2_out/v6_m3a2_result.json'))
          print('FORMAL_CLASSIFICATION',r['classification'])
          if r['classification']!='PASS_M3A2_PREEXISTING_MAIN_COMPONENT_MORPHOLOGY':
              raise SystemExit(2)
          PY
      - name: Hash outputs
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          : > v6_m3a2_out/output_sha256.txt
          for f in v6_m3a2_out/*; do
            [ -f "$f" ] || continue
            [ "$(basename "$f")" = output_sha256.txt ] && continue
            sha256sum "$f" >> v6_m3a2_out/output_sha256.txt
          done
          cat v6_m3a2_out/output_sha256.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fly-mnq-v6-m3a2-main-component-morphology
          path: v6_m3a2_out/
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
