name: V6 M5D1B valence evidence extension

on:
  push:
    branches: [claude/hello-8eabhu]
    paths:
      - ".github/workflows/v6_m5d1b_valence_extension.yml"
      - "fly_mnq/v6_m5d1b_valence_extension_verifier.py"
      - "research/v6_m5d1b_valence_extension_table.json"
      - "research/v6_m5d1b_valence_extension_protocol.md"
      - "research/v6_m5d1b_valence_extension_protocol_amendment_20260926.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"

      - name: Install pinned dependencies
        run: |
          python -m pip install --disable-pip-version-check numpy==2.1.3 pandas==2.2.3 pyarrow==17.0.0

      - name: Acquire pinned sources
        run: |
          set -euo pipefail
          mkdir -p v6_m5d1_work v6_m5b3b_work v6_m5d1b_out
          base=https://raw.githubusercontent.com/elifesciences/elife-article-xml/d146492a0d8efed2fc3bb377ef9b22dde455936b/articles
          for f in elife-16135-v2.xml elife-04580-v1.xml elife-04577-v1.xml elife-62576-v2.xml elife-90523-v1.xml elife-49257-v3.xml; do
            curl --fail --location --retry 5 --retry-delay 5 -o "v6_m5d1_work/$f" "$base/$f"
          done
          curl --fail --location --retry 5 --retry-delay 5 \
            -o v6_m5b3b_work/body-annotations.feather \
            https://storage.googleapis.com/flyem-male-cns/v1.0/connectome-data/flat-connectome/body-annotations-male-cns-v1.0-minconf-0.5.feather
          sha256sum v6_m5d1_work/* v6_m5b3b_work/body-annotations.feather | tee v6_m5d1b_out/source_sha256.txt

      - name: Freeze execution bytes
        run: |
          sha256sum \
            research/v6_m5d1b_valence_extension_protocol.md \
            research/v6_m5d1b_valence_extension_protocol_amendment_20260926.md \
            research/v6_m5d1b_valence_extension_table.json \
            fly_mnq/v6_m5d1b_valence_extension_verifier.py \
            fly_mnq/v6_m5d1_valence_source_verifier.py \
            research/v6_m5d1_valence_source_table.json \
            research/results/v6_m5d1_valence_source_result.json \
            | tee v6_m5d1b_out/preexecution_sha256.txt

      - name: Execute frozen M5D1B verifier
        run: |
          set -euo pipefail
          python fly_mnq/v6_m5d1b_valence_extension_verifier.py | tee v6_m5d1b_out/stdout.txt

      - name: Enforce classification vocabulary
        run: |
          python - <<'PY'
          import json
          r=json.load(open("v6_m5d1b_out/v6_m5d1b_valence_extension_result.json", encoding="utf-8"))
          allowed={
            "PASS_M5D1B_VALENCE_EXTENSION_FROZEN",
            "FAIL_M5D1B_VALENCE_EXTENSION_INTEGRITY",
            "BLOCKED_M5D1B_SOURCE_PARITY",
          }
          print("FORMAL_CLASSIFICATION",r["classification"])
          if r["classification"] not in allowed:
              raise SystemExit(2)
          PY

      - name: Hash outputs
        if: always()
        run: |
          set -euo pipefail
          : > v6_m5d1b_out/output_sha256.txt
          for f in v6_m5d1b_out/*; do
            [ -f "$f" ] || continue
            [ "$(basename "$f")" = output_sha256.txt ] && continue
            sha256sum "$f" >> v6_m5d1b_out/output_sha256.txt
          done
          cat v6_m5d1b_out/output_sha256.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fly-mnq-v6-m5d1b-valence-extension
          path: v6_m5d1b_out/
          retention-days: 14
          compression-level: 0

      - name: Persist formal summary result
        if: success()
        run: |
          set -euo pipefail
          mkdir -p research/results
          cp v6_m5d1b_out/v6_m5d1b_valence_extension_result.json research/results/v6_m5d1b_valence_extension_result.json
          cp v6_m5d1b_out/output_sha256.txt research/results/v6_m5d1b_valence_extension_output_sha256.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/results/v6_m5d1b_valence_extension_result.json research/results/v6_m5d1b_valence_extension_output_sha256.txt
          if git diff --cached --quiet; then
            echo "No result change"
          else
            git commit -m "V6-M5D1B: record valence extension result [skip ci]"
            git push
          fi
