name: Homelander P1 Live Gate Assistant CI

on:
  push:
    branches:
      - homelander-p1-live-gate-assistant-20260919
    paths:
      - 'homelander_p1_build/runtime_promotion/P1_LIVE_GATE_ASSISTANT.ps1'
      - 'homelander_p1_build/runtime_promotion/LIVE_GATE_ASSISTANT.md'
      - 'homelander_p1_build/runtime_promotion/START_V003_LIVE_TEST.ps1'
      - 'homelander_p1_build/runtime_promotion/START_V003_LIVE_TEST.cmd'
      - 'homelander_p1_build/runtime_promotion/promotion_manifest.json'
      - '.github/workflows/homelander-p1-live-gate-assistant-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-live-observer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse PowerShell source
        shell: pwsh
        run: |
          $path=(Resolve-Path 'homelander_p1_build/runtime_promotion/P1_LIVE_GATE_ASSISTANT.ps1').Path
          $tokens=$null
          $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile($path,[ref]$tokens,[ref]$errors) | Out-Null
          if($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.ToString() }
            throw "PowerShell parser found $($errors.Count) error(s)."
          }
          Write-Host 'PowerShell AST parse PASS'

      - name: Run observer self-test
        shell: pwsh
        run: |
          pwsh -NoProfile -File ./homelander_p1_build/runtime_promotion/P1_LIVE_GATE_ASSISTANT.ps1 -Action SelfTest
          if($LASTEXITCODE -ne 0) { throw "SelfTest exit $LASTEXITCODE" }

      - name: Test positive v003 evidence fixture
        shell: pwsh
        run: |
          @'
          READY build=P1_RuntimeProbe_003_FREEAIM_STAGED_20260918
          F4: read-only discovery + flight math probe
          [HOMELANDER_P1_FREEAIM_V004] CAMERA | pos=1,2,3
          [HOMELANDER_P1_FREEAIM_V004] HIT | fraction=0.5 hitGOH=12345
          '@ | Set-Content -LiteralPath good_v003.log -Encoding UTF8
          pwsh -NoProfile -File ./homelander_p1_build/runtime_promotion/P1_LIVE_GATE_ASSISTANT.ps1 -Action EvaluateLog -Stage v003 -LogPath good_v003.log
          if($LASTEXITCODE -ne 0) { throw "Expected good fixture exit 0, got $LASTEXITCODE" }

      - name: Test incomplete v003 fixture fails closed
        shell: pwsh
        run: |
          @'
          READY build=P1_RuntimeProbe_003_FREEAIM_STAGED_20260918
          F4: read-only discovery + flight math probe
          [HOMELANDER_P1_FREEAIM_V004] CAMERA | pos=1,2,3
          '@ | Set-Content -LiteralPath incomplete_v003.log -Encoding UTF8
          pwsh -NoProfile -File ./homelander_p1_build/runtime_promotion/P1_LIVE_GATE_ASSISTANT.ps1 -Action EvaluateLog -Stage v003 -LogPath incomplete_v003.log
          $code=$LASTEXITCODE
          if($code -ne 4) { throw "Expected incomplete fixture exit 4, got $code" }
          Write-Host 'Incomplete fixture fail-closed PASS'
          exit 0

      - name: Test forbidden evidence blocks
        shell: pwsh
        run: |
          @'
          READY build=P1_RuntimeProbe_003_FREEAIM_STAGED_20260918
          FATAL synthetic test
          F4: read-only discovery + flight math probe
          [HOMELANDER_P1_FREEAIM_V004] CAMERA | pos=1,2,3
          [HOMELANDER_P1_FREEAIM_V004] HIT | fraction=0.5 hitGOH=12345
          '@ | Set-Content -LiteralPath forbidden_v003.log -Encoding UTF8
          pwsh -NoProfile -File ./homelander_p1_build/runtime_promotion/P1_LIVE_GATE_ASSISTANT.ps1 -Action EvaluateLog -Stage v003 -LogPath forbidden_v003.log
          $code=$LASTEXITCODE
          if($code -ne 5) { throw "Expected forbidden fixture exit 5, got $code" }
          Write-Host 'Forbidden fixture hard-block PASS'
          exit 0

      - name: Verify non-authoritative trust boundary
        shell: pwsh
        run: |
          $p='homelander_p1_build/runtime_promotion/P1_LIVE_GATE_ASSISTANT.ps1'
          $s=Get-Content -LiteralPath $p -Raw
          $required=@(
            'authoritative=$false',
            'visualConfirmed=$false',
            'Observer candidate only',
            'Observer never writes PASS receipts',
            'Use P1_PROMOTION_MANAGER.ps1 -Action ResetLog',
            'Refusing stale-evidence risk'
          )
          foreach($needle in $required) {
            if(-not $s.Contains($needle)) { throw "Missing trust-boundary control: $needle" }
          }
          $forbiddenRegex=@(
            '(?i)SendKeys',
            '(?i)keybd_event',
            '(?i)SetForegroundWindow',
            '(?i)&\s+.*P1_PROMOTION_MANAGER\.ps1\s+-Action\s+Check',
            '(?i)&\s+.*P1_PROMOTION_MANAGER\.ps1\s+-Action\s+Install',
            '(?i)function\s+Add-Pass',
            '(?i)passedStages\s*=',
            '(?i)Copy-Item[^\r\n]+homelander_p1\.asi',
            '(?i)Copy-Item[^\r\n]+lua_p1'
          )
          foreach($rx in $forbiddenRegex) {
            if($s -match $rx) { throw "Forbidden automation/mutation primitive matched: $rx" }
          }
          Write-Host 'Observer trust boundary PASS'

      - name: Verify launch and monitoring semantics
        shell: pwsh
        run: |
          $s=Get-Content 'homelander_p1_build/runtime_promotion/P1_LIVE_GATE_ASSISTANT.ps1' -Raw
          $need=@(
            'Start-Process -FilePath $exe -WorkingDirectory $Root -PassThru',
            'Get-Process -Id ([int]$session.processId)',
            'homelander_p1_runtime.log',
            'Get-LogEvaluation',
            'Write-Candidate',
            'LOG_COMPLETE',
            'PROCESS_EXITED_INCOMPLETE',
            'TIMEOUT'
          )
          foreach($needle in $need) {
            if(-not $s.Contains($needle)) { throw "Missing observer behavior: $needle" }
          }
          Write-Host 'Launch/monitor semantics PASS'

      - name: Validate first-live-test launcher
        shell: pwsh
        run: |
          $path=(Resolve-Path 'homelander_p1_build/runtime_promotion/START_V003_LIVE_TEST.ps1').Path
          $tokens=$null
          $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile($path,[ref]$tokens,[ref]$errors) | Out-Null
          if($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.ToString() }
            throw "Launcher parser found $($errors.Count) error(s)."
          }
          $s=Get-Content -LiteralPath $path -Raw
          if(-not $s.Contains("& $Manager -Action Install -Stage v003 -PrototypeRoot $Root")) { throw 'Launcher does not contain exact v003 install call.' }
          if(-not $s.Contains("& $Observer -Action Observe -Stage v003 -PrototypeRoot $Root")) { throw 'Launcher does not contain exact v003 observer call.' }
          if($s -match '(?i)-Action\s+Check') { throw 'Launcher must never record Check/PASS.' }
          if($s -match '(?i)-Stage\s+v00(4|5|6|7|8|9)|-Stage\s+v01[0-6]') { throw 'Launcher must not contain a later-stage install/observe action.' }
          if(-not $s.Contains('Refusing any skip or later-stage action')) { throw 'Missing no-skip guard.' }
          if(-not $s.Contains('Refusing stale evidence')) { throw 'Missing stale-log guard.' }
          $cmd=Get-Content 'homelander_p1_build/runtime_promotion/START_V003_LIVE_TEST.cmd' -Raw
          if(-not $cmd.Contains('START_V003_LIVE_TEST.ps1')) { throw 'CMD wrapper does not call launcher.' }
          Write-Host 'First-live-test launcher PASS'

      - name: Assemble validated live-assistant artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path live_assistant_release | Out-Null
          Copy-Item homelander_p1_build/runtime_promotion/P1_LIVE_GATE_ASSISTANT.ps1 live_assistant_release/
          Copy-Item homelander_p1_build/runtime_promotion/LIVE_GATE_ASSISTANT.md live_assistant_release/
          Copy-Item homelander_p1_build/runtime_promotion/promotion_manifest.json live_assistant_release/
          Copy-Item homelander_p1_build/runtime_promotion/START_V003_LIVE_TEST.ps1 live_assistant_release/
          Copy-Item homelander_p1_build/runtime_promotion/START_V003_LIVE_TEST.cmd live_assistant_release/
          @'
          branch=homelander-p1-live-gate-assistant-20260919
          commit=${{ github.sha }}
          ci_run=${{ github.run_id }}
          status=WINDOWS_CI_VALIDATED
          authoritative_pass_writer=P1_PROMOTION_MANAGER.ps1_only
          '@ | Set-Content -LiteralPath live_assistant_release/VALIDATION.txt -Encoding UTF8
          Get-ChildItem live_assistant_release -File | ForEach-Object {
            $h=(Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$h  $($_.Name)"
          } | Set-Content -LiteralPath live_assistant_release/SHA256SUMS.txt -Encoding ASCII

      - uses: actions/upload-artifact@v4
        with:
          name: Homelander_P1_LiveGateAssistant_v001_VALIDATED
          path: live_assistant_release/
          if-no-files-found: error
