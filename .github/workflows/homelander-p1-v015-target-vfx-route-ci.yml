name: Homelander P1 v015 Target VFX Route CI

on:
  push:
    branches:
      - homelander-p1-v015-target-vfx-route-20260919
    paths:
      - 'homelander_p1_build/homelander_p1.cpp'
      - 'homelander_p1_build/lua_p1/target_vfx_route_probe_v016_STAGED.lua'
      - 'homelander_p1_build/P1_TARGET_VFX_ROUTE_GATE_20260919.md'
      - 'homelander_p1_build/V015_REPRO_TRIGGER.txt'
      - '.github/workflows/homelander-p1-v015-target-vfx-route-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-static-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Win32 and Lua 5.1 tools
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-mingw-w64-i686 binutils-mingw-w64-i686 lua5.1

      - name: Build v015
        run: |
          mkdir -p homelander_p1_build/build_v015
          i686-w64-mingw32-g++ homelander_p1_build/homelander_p1.cpp \
            -std=gnu++17 -O2 -Wall -Wextra \
            -shared -static-libgcc -static-libstdc++ \
            -Wl,--subsystem,windows \
            -o homelander_p1_build/build_v015/homelander_p1_v015.asi \
            -luser32
          test -s homelander_p1_build/build_v015/homelander_p1_v015.asi

      - name: Verify PE32 imports and build identity
        run: |
          file homelander_p1_build/build_v015/homelander_p1_v015.asi | tee homelander_p1_build/build_v015/file.txt
          i686-w64-mingw32-objdump -f homelander_p1_build/build_v015/homelander_p1_v015.asi | tee homelander_p1_build/build_v015/headers.txt
          i686-w64-mingw32-objdump -p homelander_p1_build/build_v015/homelander_p1_v015.asi | tee homelander_p1_build/build_v015/imports.txt
          grep -Eiq 'pei-i386|i386' homelander_p1_build/build_v015/headers.txt
          if grep -Eiq 'libstdc\+\+-6\.dll|libgcc_s_.*\.dll|libwinpthread-1\.dll' homelander_p1_build/build_v015/imports.txt; then exit 1; fi
          grep -q 'P1_RuntimeProbe_015_TARGET_VFX_ROUTE_STAGED_20260919' homelander_p1_build/homelander_p1.cpp

      - name: Validate Lua 5.1
        run: |
          LUAC="$(command -v luac5.1 || command -v luac)"
          "$LUAC" -p homelander_p1_build/lua_p1/target_vfx_route_probe_v016_STAGED.lua

      - name: Lock upstream chain through F21
        run: |
          echo 'b23baf1a08c0358f7eab10f291566f6e26ec9a6cae7bd52fb8415edac6f99350  homelander_p1_build/lua_p1/lasersight_native_gate_v008_STAGED.lua' | sha256sum -c -
          echo '1bf101a352722b809e2137437161ac44e527039f9a4720961d5d058fec7774f2  homelander_p1_build/lua_p1/lasersight_held_gate_v009_STAGED.lua' | sha256sum -c -
          echo '44ea5cdf6f6b0241834f25ec4f66675efa48bfe42a6340cacd6498a9c1f33b01  homelander_p1_build/lua_p1/lasersight_dynamic_aim_gate_v010_STAGED.lua' | sha256sum -c -
          echo '1061aeb0b066c14c06295c48818db3b8b078071c973a6ce6953e1f6d70916cdd  homelander_p1_build/lua_p1/heatvision_damage_gate_v011_STAGED.lua' | sha256sum -c -
          echo '5647a396b03046e537179f1c91a6a8b9373a799618b21c9d3e93cc4e19d3949e  homelander_p1_build/lua_p1/impact_vfx_gate_v012_STAGED.lua' | sha256sum -c -
          echo 'f29934a16e20b88cbdfa82ce14b722700914e01fd7f5595dc551a144b6511ccc  homelander_p1_build/lua_p1/target_continuity_probe_v013_STAGED.lua' | sha256sum -c -
          echo '07e996ce56d8a3440fe25fcd8038801337e8278b04b53c41b5834bf52bdce888  homelander_p1_build/lua_p1/dot_dryrun_scheduler_v014_STAGED.lua' | sha256sum -c -
          echo '9c58fe1880788c430dfb56d984444dde8c2e6d4f299d8ceaa6a070d3d7c78506  homelander_p1_build/lua_p1/damagehit_payload_probe_v015_STAGED.lua' | sha256sum -c -

      - name: Verify F22 native staging bridge
        run: |
          C=homelander_p1_build/homelander_p1.cpp
          grep -q 'g_f22Prev' "$C"
          grep -q 'g_targetVfxRouteReady' "$C"
          grep -q 'target_vfx_route_probe_v016_STAGED.lua' "$C"
          grep -q 'RisingEdge(VK_F22, g_f22Prev, inputEnabled)' "$C"
          grep -q 'Homelander_TargetVFXRouteProbeV016' "$C"
          grep -q 'F22=READ-ONLY target classification/VFX route' "$C"

      - name: Verify exact upstream target identity
        run: |
          P=homelander_p1_build/lua_p1/target_vfx_route_probe_v016_STAGED.lua
          grep -q 'HOMELANDER_DAMAGEHIT_PAYLOAD_PASSED ~= true' "$P"
          grep -q 'local target = HOMELANDER_DAMAGEHIT_PAYLOAD_TARGET' "$P"
          grep -q 'HOMELANDER_DOT_DRYRUN_TARGET ~= target' "$P"
          grep -q 'HOMELANDER_TARGET_CONTINUITY_TARGET ~= target' "$P"
          grep -q 'HOMELANDER_DAMAGE_LAST_TARGET ~= target' "$P"

      - name: Verify read-only classification inputs
        run: |
          P=homelander_p1_build/lua_p1/target_vfx_route_probe_v016_STAGED.lua
          grep -q 'ai_GetClassName' "$P"
          grep -q 'go_IsHelicopter' "$P"
          grep -q 'go_IsFactionMilitary' "$P"
          grep -q 'go_IsFactionInfected' "$P"
          grep -q 'go_GetDebugName' "$P"
          grep -q 'pcall(go_GetHealth, target)' "$P"
          grep -q 'pcall(go_GetMaxHealth, target)' "$P"

      - name: Verify conservative route policy
        run: |
          P=homelander_p1_build/lua_p1/target_vfx_route_probe_v016_STAGED.lua
          grep -q 'route = "HELICOPTER_METAL"' "$P"
          grep -q 'candidate = "debrisSparks001"' "$P"
          grep -q 'route = "INFECTED_ORGANIC_UNRESOLVED"' "$P"
          grep -q 'route = "MILITARY_UNRESOLVED"' "$P"
          grep -q 'local route = "GENERIC"' "$P"
          grep -q 'local candidate = "missileImpact001"' "$P"
          grep -q 'HOMELANDER_VFX_ROUTE_RUNTIME_PROVEN = false' "$P"
          grep -q 'HOMELANDER_TARGET_CLASSIFICATION_PASSED = true' "$P"

      - name: Verify strict read-only boundary
        run: |
          P=homelander_p1_build/lua_p1/target_vfx_route_probe_v016_STAGED.lua
          if grep -Eq 'go_ApplyDamage\(|go_ApplyDamageAndHit\(|em_AddWorldEffect|go_SetHealth|go_SetMaxHealth|phys_SetLinearVelocity|phys_SetAngularVelocity|go_Teleport|go_PlayerTeleport|pcall\(ai_Laser|HL_LaserSightSubmitDual' "$P"; then
            echo "Forbidden gameplay mutation/render submit found in F22 classifier"
            exit 1
          fi

      - name: Verify route documentation boundaries
        run: |
          D=homelander_p1_build/P1_TARGET_VFX_ROUTE_GATE_20260919.md
          grep -q 'goreBlood-family resources exist, but an exact runtime world-effect identifier has not yet been proven' "$D"
          grep -q 'faction alone does not prove human vs ground vehicle vs structure' "$D"
          grep -q 'HOMELANDER_VFX_ROUTE_RUNTIME_PROVEN' "$D"

      - name: Hash build and sources
        run: |
          sha256sum homelander_p1_build/build_v015/homelander_p1_v015.asi | tee homelander_p1_build/build_v015/sha256.txt
          sha256sum homelander_p1_build/lua_p1/target_vfx_route_probe_v016_STAGED.lua
          sha256sum homelander_p1_build/P1_TARGET_VFX_ROUTE_GATE_20260919.md
          sha256sum homelander_p1_build/homelander_p1.cpp

      - name: Assemble dormant v015 bundle
        run: |
          mkdir -p stage_v015/lua_p1 stage_v015/CI_EVIDENCE
          cp homelander_p1_build/build_v015/homelander_p1_v015.asi stage_v015/
          cp homelander_p1_build/lua_p1/lasersight_native_gate_v008_STAGED.lua stage_v015/lua_p1/
          cp homelander_p1_build/lua_p1/lasersight_held_gate_v009_STAGED.lua stage_v015/lua_p1/
          cp homelander_p1_build/lua_p1/lasersight_dynamic_aim_gate_v010_STAGED.lua stage_v015/lua_p1/
          cp homelander_p1_build/lua_p1/heatvision_damage_gate_v011_STAGED.lua stage_v015/lua_p1/
          cp homelander_p1_build/lua_p1/impact_vfx_gate_v012_STAGED.lua stage_v015/lua_p1/
          cp homelander_p1_build/lua_p1/target_continuity_probe_v013_STAGED.lua stage_v015/lua_p1/
          cp homelander_p1_build/lua_p1/dot_dryrun_scheduler_v014_STAGED.lua stage_v015/lua_p1/
          cp homelander_p1_build/lua_p1/damagehit_payload_probe_v015_STAGED.lua stage_v015/lua_p1/
          cp homelander_p1_build/lua_p1/target_vfx_route_probe_v016_STAGED.lua stage_v015/lua_p1/
          cp homelander_p1_build/P1_DAMAGE_AND_HIT_VECTOR_AUDIT_20260919.md stage_v015/
          cp homelander_p1_build/P1_DAMAGEHIT_PAYLOAD_GATE_20260919.md stage_v015/
          cp homelander_p1_build/P1_HEALTH_TIME_ABI_20260919.md stage_v015/
          cp homelander_p1_build/P1_TARGET_CONTINUITY_GATE_20260919.md stage_v015/
          cp homelander_p1_build/P1_DOT_DRYRUN_GATE_20260919.md stage_v015/
          cp homelander_p1_build/P1_TARGET_VFX_ROUTE_GATE_20260919.md stage_v015/
          cp homelander_p1_build/P1_IMPACT_VFX_ABI_20260919.md stage_v015/
          cp homelander_p1_build/P1_IMPACT_VFX_GATE_20260919.md stage_v015/
          cp homelander_p1_build/homelander_p1.cpp stage_v015/homelander_p1_v015_SOURCE.cpp
          cp homelander_p1_build/build_v015/file.txt stage_v015/CI_EVIDENCE/
          cp homelander_p1_build/build_v015/headers.txt stage_v015/CI_EVIDENCE/
          cp homelander_p1_build/build_v015/imports.txt stage_v015/CI_EVIDENCE/
          cp homelander_p1_build/build_v015/sha256.txt stage_v015/CI_EVIDENCE/
          (cd stage_v015 && sha256sum homelander_p1_v015.asi lua_p1/*.lua P1_DAMAGE_AND_HIT_VECTOR_AUDIT_20260919.md P1_DAMAGEHIT_PAYLOAD_GATE_20260919.md P1_HEALTH_TIME_ABI_20260919.md P1_TARGET_CONTINUITY_GATE_20260919.md P1_DOT_DRYRUN_GATE_20260919.md P1_TARGET_VFX_ROUTE_GATE_20260919.md P1_IMPACT_VFX_ABI_20260919.md P1_IMPACT_VFX_GATE_20260919.md homelander_p1_v015_SOURCE.cpp > SHA256SUMS.txt)
          (cd stage_v015 && sha256sum -c SHA256SUMS.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: Homelander_P1_v015_TargetVFXRouteGate_DORMANT
          path: stage_v015/
          if-no-files-found: error
