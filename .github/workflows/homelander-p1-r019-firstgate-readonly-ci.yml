name: Homelander P1 R019 Read-Only First-Live Preflight Windows CI
on:
  push:
    branches: [homelander-p1-r019-firstgate-readonly-preflight-20260919]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  firstgate-readonly:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Assert frozen original release, manager, native and source stages unmodified
        shell: pwsh
        run: |
          $base='71365a2be7352cad6e926e35bac4176bad101a07'
          $changed=@(git diff --name-only "$base...HEAD")
          $allowed=@(
            'homelander_p1_build/tests/r019_firstgate_readonly/P1_FIRST_GATE_READONLY_PREFLIGHT.ps1',
            'homelander_p1_build/tests/r019_firstgate_readonly/README.md',
            'homelander_p1_build/tests/r019_firstgate_readonly/P1_R019_WINDOWS_SYNTHETIC_PREFLIGHT_FIXTURE.ps1',
            '.github/workflows/homelander-p1-r019-firstgate-readonly-ci.yml'
          )
          foreach($file in $changed) { if($allowed -cnotcontains $file){ throw "Unexpected original game/release/code mutation: $file" } }
          Write-Host 'P1_R019_ORIGINAL_GAME_NATIVE_R007_AND_R018_SOURCES_UNCHANGED_PASS'
      - name: Parse and test read-only log chronology using Windows PowerShell 5.1
        shell: powershell
        run: |
          $p='homelander_p1_build/tests/r019_firstgate_readonly/P1_FIRST_GATE_READONLY_PREFLIGHT.ps1'
          $tokens=$null;$errors=$null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $p).Path,[ref]$tokens,[ref]$errors)
          if (@($errors).Count -gt 0) { throw "PowerShell 5.1 parser rejected R019: $errors" }
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $p -Action SelfTest
          if($LASTEXITCODE -ne 0){throw "R019 independent chronology test failed with exit=$LASTEXITCODE"}
          Write-Host 'P1_R019_WINDOWS_POWERSHELL_51_PARSE_AND_LOG_CHRONOLOGY_PASS'
      - name: Execute functional fake-game preflight and failure-path regression
        shell: powershell
        run: |
          & .\homelander_p1_build\tests\r019_firstgate_readonly\P1_R019_WINDOWS_SYNTHETIC_PREFLIGHT_FIXTURE.ps1
          if($LASTEXITCODE -and $LASTEXITCODE -ne 0){exit $LASTEXITCODE}
      - name: Publish isolated read-only tool and instructions, NO game/installer/binary
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path stage | Out-Null
          Copy-Item homelander_p1_build/tests/r019_firstgate_readonly/P1_FIRST_GATE_READONLY_PREFLIGHT.ps1 stage/
          Copy-Item homelander_p1_build/tests/r019_firstgate_readonly/README.md stage/
          foreach($f in Get-ChildItem stage -File){
            if($f.Extension -notin @('.ps1','.md')){throw "Unexpected binary/install artifact $($f.Name)"}
            "$( (Get-FileHash -LiteralPath $f.FullName -Algorithm SHA256).Hash.ToLowerInvariant())  $($f.Name)" | Add-Content -LiteralPath stage/SHA256SUMS.txt
          }
          Write-Host 'P1_R019_READONLY_NO_GAME_BINARY_OR_INSTALLER_PACKAGE_PASS'
      - uses: actions/upload-artifact@v4
        with:
          name: Homelander_P1_R019_OriginalR007_ReadOnlyPreflight_NOT_INSTALLER
          path: stage/
          if-no-files-found: error
