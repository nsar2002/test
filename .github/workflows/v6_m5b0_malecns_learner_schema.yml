name: V6 M5B0 learner schema gate
# trigger revision 1; no scientific rule change

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v6_m5b0_malecns_learner_schema.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  schema:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.1.3 pandas==2.2.3 pyarrow==17.0.0
      - name: Acquire sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p v6_m5b0_work v6_m5b0_out
          curl --fail --location --retry 5 --retry-delay 5 -o v6_m5b0_work/brain.npz https://github.com/alextitonis/fly.ai/releases/download/brain-v1/brain.npz
          echo 'cc9bd1ecd00bd703a6fa648bc6ad145c93c7c1ee53debdcc9ce0d1f4305e6aca  v6_m5b0_work/brain.npz' | sha256sum -c -
          curl --fail --location --retry 5 --retry-delay 5 -o v6_m5b0_work/body-annotations.feather https://storage.googleapis.com/flyem-male-cns/v1.0/connectome-data/flat-connectome/body-annotations-male-cns-v1.0-minconf-0.5.feather
          curl --fail --location --retry 5 --retry-delay 5 -o v6_m5b0_work/syn-partners.feather https://storage.googleapis.com/flyem-male-cns/v1.0/connectome-data/flat-connectome/syn-partners-male-cns-v1.0-minconf-0.5.feather
          sha256sum v6_m5b0_work/* | tee v6_m5b0_out/input_sha256.txt
      - name: Freeze execution bytes
        run: sha256sum research/v6_m5b0_malecns_learner_schema_protocol.md fly_mnq/v6_m5b0_malecns_learner_schema.py | tee v6_m5b0_out/preexecution_sha256.txt
      - name: Execute schema probe
        run: python fly_mnq/v6_m5b0_malecns_learner_schema.py | tee v6_m5b0_out/stdout.txt
      - name: Hash result
        if: always()
        run: sha256sum v6_m5b0_out/* | tee v6_m5b0_out/output_sha256.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fly-mnq-v6-m5b0-learner-schema
          path: v6_m5b0_out/
          retention-days: 14
          compression-level: 0
