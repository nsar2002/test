name: Homelander P1 v009 Dynamic Stability CI

on:
  push:
    branches:
      - homelander-p1-v009-dynamic-stability-20260919
    paths:
      - 'homelander_p1_build/homelander_p1.cpp'
      - 'homelander_p1_build/lua_p1/lasersight_native_gate_v008_STAGED.lua'
      - 'homelander_p1_build/lua_p1/lasersight_held_gate_v009_STAGED.lua'
      - 'homelander_p1_build/lua_p1/lasersight_dynamic_aim_gate_v010_STAGED.lua'
      - 'homelander_p1_build/P1_DYNAMIC_STABILITY_GATE_20260919.md'
      - '.github/workflows/homelander-p1-v009-dynamic-stability-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-static-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Win32 and Lua 5.1 tools
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-mingw-w64-i686 binutils-mingw-w64-i686 lua5.1

      - name: Build v009
        run: |
          mkdir -p homelander_p1_build/build_v009
          i686-w64-mingw32-g++ homelander_p1_build/homelander_p1.cpp \
            -std=gnu++17 -O2 -Wall -Wextra \
            -shared -static-libgcc -static-libstdc++ \
            -Wl,--subsystem,windows \
            -o homelander_p1_build/build_v009/homelander_p1_v009.asi \
            -luser32
          test -s homelander_p1_build/build_v009/homelander_p1_v009.asi

      - name: Verify PE32 imports and build identity
        run: |
          file homelander_p1_build/build_v009/homelander_p1_v009.asi | tee homelander_p1_build/build_v009/file.txt
          i686-w64-mingw32-objdump -f homelander_p1_build/build_v009/homelander_p1_v009.asi | tee homelander_p1_build/build_v009/headers.txt
          i686-w64-mingw32-objdump -p homelander_p1_build/build_v009/homelander_p1_v009.asi | tee homelander_p1_build/build_v009/imports.txt
          grep -Eiq 'pei-i386|i386' homelander_p1_build/build_v009/headers.txt
          if grep -Eiq 'libstdc\+\+-6\.dll|libgcc_s_.*\.dll|libwinpthread-1\.dll' homelander_p1_build/build_v009/imports.txt; then exit 1; fi
          grep -q 'P1_RuntimeProbe_009_DYNAMIC_STABILITY_STAGED_20260919' homelander_p1_build/homelander_p1.cpp

      - name: Validate Lua 5.1
        run: |
          LUAC="$(command -v luac5.1 || command -v luac)"
          "$LUAC" -p homelander_p1_build/lua_p1/lasersight_native_gate_v008_STAGED.lua
          "$LUAC" -p homelander_p1_build/lua_p1/lasersight_held_gate_v009_STAGED.lua
          "$LUAC" -p homelander_p1_build/lua_p1/lasersight_dynamic_aim_gate_v010_STAGED.lua

      - name: Verify native dynamic stability proof
        run: |
          C=homelander_p1_build/homelander_p1.cpp
          grep -q 'g_laserDynamicStabilityPassed' "$C"
          grep -q 'g_laserDynamicSubmitFrames' "$C"
          grep -q 'g_laserDynamicSubmitFrames >= 120u' "$C"
          grep -q 'F16 NATIVE STABILITY PASS' "$C"
          grep -q 'HL_LaserSightResetDynamicGate' "$C"
          grep -q 'HL_LaserSightDynamicStabilityProbe' "$C"
          grep -q 'g_laserDynamicStabilityPassed = false' "$C"
          grep -q 'g_laserDynamicSubmitFrames = 0' "$C"

      - name: Verify Lua/native dynamic agreement
        run: |
          D=homelander_p1_build/lua_p1/lasersight_dynamic_aim_gate_v010_STAGED.lua
          grep -q 'HL_LaserSightResetDynamicGate' "$D"
          grep -q 'HL_LaserSightDynamicStabilityProbe' "$D"
          grep -q 'HOMELANDER_DYNAMIC_AIM_STABILITY_PASSED = false' "$D"
          grep -q 'HOMELANDER_DYNAMIC_AIM_STABILITY_PASSED = true' "$D"
          grep -q 'if S.frames == 120' "$D"
          grep -q 'Lua/native F16 stability mismatch' "$D"
          grep -q 'HOMELANDER_DYNAMIC_AIM_STABILITY_RENDER_FRAMES = S.frames' "$D"

      - name: Verify downstream invalidation graph
        run: |
          N=homelander_p1_build/lua_p1/lasersight_native_gate_v008_STAGED.lua
          H=homelander_p1_build/lua_p1/lasersight_held_gate_v009_STAGED.lua
          grep -q 'HOMELANDER_DYNAMIC_AIM_STABILITY_PASSED = false' "$N"
          grep -q 'HOMELANDER_DYNAMIC_AIM_STABILITY_PASSED = false' "$H"
          grep -q 'downstream dynamic proof invalidated' homelander_p1_build/homelander_p1.cpp

      - name: Verify mutation boundary
        run: |
          for F in homelander_p1_build/lua_p1/lasersight_native_gate_v008_STAGED.lua \
                   homelander_p1_build/lua_p1/lasersight_held_gate_v009_STAGED.lua \
                   homelander_p1_build/lua_p1/lasersight_dynamic_aim_gate_v010_STAGED.lua; do
            if grep -Eq 'go_ApplyDamage|go_ApplyDamageAndHit|em_AddWorldEffect|em_AddWorldEffectOriented|phys_SetLinearVelocity|phys_SetAngularVelocity|pcall\(ai_Laser' "$F"; then
              echo "Forbidden mutation/legacy renderer in $F"
              exit 1
            fi
          done

      - name: Hash build and sources
        run: |
          sha256sum homelander_p1_build/build_v009/homelander_p1_v009.asi | tee homelander_p1_build/build_v009/sha256.txt
          sha256sum homelander_p1_build/lua_p1/lasersight_native_gate_v008_STAGED.lua
          sha256sum homelander_p1_build/lua_p1/lasersight_held_gate_v009_STAGED.lua
          sha256sum homelander_p1_build/lua_p1/lasersight_dynamic_aim_gate_v010_STAGED.lua
          sha256sum homelander_p1_build/P1_DYNAMIC_STABILITY_GATE_20260919.md
          sha256sum homelander_p1_build/homelander_p1.cpp

      - name: Assemble dormant v009 bundle
        run: |
          mkdir -p stage_v009/lua_p1 stage_v009/CI_EVIDENCE
          cp homelander_p1_build/build_v009/homelander_p1_v009.asi stage_v009/
          cp homelander_p1_build/lua_p1/lasersight_native_gate_v008_STAGED.lua stage_v009/lua_p1/
          cp homelander_p1_build/lua_p1/lasersight_held_gate_v009_STAGED.lua stage_v009/lua_p1/
          cp homelander_p1_build/lua_p1/lasersight_dynamic_aim_gate_v010_STAGED.lua stage_v009/lua_p1/
          cp homelander_p1_build/P1_NATIVE_LASERSIGHT_GATE_20260919.md stage_v009/
          cp homelander_p1_build/P1_NATIVE_LASERSIGHT_BINARY_AUDIT_20260919.md stage_v009/
          cp homelander_p1_build/P1_HELD_LASERSIGHT_GATE_20260919.md stage_v009/
          cp homelander_p1_build/P1_DYNAMIC_FREEAIM_GATE_20260919.md stage_v009/
          cp homelander_p1_build/P1_DYNAMIC_STABILITY_GATE_20260919.md stage_v009/
          cp homelander_p1_build/homelander_p1.cpp stage_v009/homelander_p1_v009_SOURCE.cpp
          cp homelander_p1_build/build_v009/file.txt stage_v009/CI_EVIDENCE/
          cp homelander_p1_build/build_v009/headers.txt stage_v009/CI_EVIDENCE/
          cp homelander_p1_build/build_v009/imports.txt stage_v009/CI_EVIDENCE/
          cp homelander_p1_build/build_v009/sha256.txt stage_v009/CI_EVIDENCE/
          (cd stage_v009 && sha256sum homelander_p1_v009.asi lua_p1/*.lua P1_NATIVE_LASERSIGHT_GATE_20260919.md P1_NATIVE_LASERSIGHT_BINARY_AUDIT_20260919.md P1_HELD_LASERSIGHT_GATE_20260919.md P1_DYNAMIC_FREEAIM_GATE_20260919.md P1_DYNAMIC_STABILITY_GATE_20260919.md homelander_p1_v009_SOURCE.cpp > SHA256SUMS.txt)
          (cd stage_v009 && sha256sum -c SHA256SUMS.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: Homelander_P1_v009_DynamicStabilityGate_DORMANT
          path: stage_v009/
          if-no-files-found: error
