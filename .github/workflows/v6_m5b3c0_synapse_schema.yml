name: V6 M5B3C0 synapse source schema probe

on:
  push:
    branches: [claude/hello-8eabhu]
    paths:
      - ".github/workflows/v6_m5b3c0_synapse_schema.yml"
      - "fly_mnq/v6_m5b3c0_synapse_schema_probe.py"
      - "research/v6_m5b3c0_synapse_source_schema_protocol.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"

      - name: Install pinned dependencies
        run: |
          python -m pip install --disable-pip-version-check numpy==2.1.3 pandas==2.2.3 pyarrow==17.0.0

      - name: Freeze execution bytes
        run: |
          mkdir -p v6_m5b3c0_out
          sha256sum research/v6_m5b3c0_synapse_source_schema_protocol.md fly_mnq/v6_m5b3c0_synapse_schema_probe.py | tee v6_m5b3c0_out/preexecution_sha256.txt

      - name: Execute footer-only schema probe
        run: |
          set -euo pipefail
          python fly_mnq/v6_m5b3c0_synapse_schema_probe.py | tee v6_m5b3c0_out/stdout.txt

      - name: Enforce classification vocabulary
        run: |
          python - <<'PY'
          import json
          r=json.load(open("v6_m5b3c0_out/v6_m5b3c0_synapse_schema_result.json"))
          allowed={
            "PASS_M5B3C0_SYNAPSE_SCHEMA_RESOLVER_FEASIBLE",
            "FAIL_M5B3C0_RESOLVER_INFEASIBLE_FROM_SCHEMA",
            "BLOCKED_M5B3C0_SOURCE_SCHEMA",
          }
          print("FORMAL_CLASSIFICATION",r["classification"])
          if r["classification"] not in allowed:
              raise SystemExit(2)
          PY

      - name: Hash outputs
        if: always()
        run: |
          set -euo pipefail
          : > v6_m5b3c0_out/output_sha256.txt
          for f in v6_m5b3c0_out/*; do
            [ -f "$f" ] || continue
            [ "$(basename "$f")" = output_sha256.txt ] && continue
            sha256sum "$f" >> v6_m5b3c0_out/output_sha256.txt
          done
          cat v6_m5b3c0_out/output_sha256.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fly-mnq-v6-m5b3c0-synapse-schema
          path: v6_m5b3c0_out/
          retention-days: 14
          compression-level: 0

      - name: Persist formal summary result
        if: success()
        run: |
          set -euo pipefail
          mkdir -p research/results
          cp v6_m5b3c0_out/v6_m5b3c0_synapse_schema_result.json research/results/v6_m5b3c0_synapse_schema_result.json
          cp v6_m5b3c0_out/output_sha256.txt research/results/v6_m5b3c0_synapse_schema_output_sha256.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/results/v6_m5b3c0_synapse_schema_result.json research/results/v6_m5b3c0_synapse_schema_output_sha256.txt
          if git diff --cached --quiet; then
            echo "No result change"
          else
            git commit -m "V6-M5B3C0: record synapse schema probe result [skip ci]"
            git push
          fi
