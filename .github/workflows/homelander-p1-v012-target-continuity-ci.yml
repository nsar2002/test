name: Homelander P1 v012 Target Continuity CI

on:
  push:
    branches:
      - homelander-p1-v012-target-continuity-20260919
    paths:
      - 'homelander_p1_build/homelander_p1.cpp'
      - 'homelander_p1_build/lua_p1/target_continuity_probe_v013_STAGED.lua'
      - 'homelander_p1_build/P1_HEALTH_TIME_ABI_20260919.md'
      - 'homelander_p1_build/P1_TARGET_CONTINUITY_GATE_20260919.md'
      - 'homelander_p1_build/V012_REPRO_TRIGGER.txt'
      - '.github/workflows/homelander-p1-v012-target-continuity-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-static-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Win32 and Lua 5.1 tools
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-mingw-w64-i686 binutils-mingw-w64-i686 lua5.1

      - name: Build v012
        run: |
          mkdir -p homelander_p1_build/build_v012
          i686-w64-mingw32-g++ homelander_p1_build/homelander_p1.cpp \
            -std=gnu++17 -O2 -Wall -Wextra \
            -shared -static-libgcc -static-libstdc++ \
            -Wl,--subsystem,windows \
            -o homelander_p1_build/build_v012/homelander_p1_v012.asi \
            -luser32
          test -s homelander_p1_build/build_v012/homelander_p1_v012.asi

      - name: Verify PE32 imports and build identity
        run: |
          file homelander_p1_build/build_v012/homelander_p1_v012.asi | tee homelander_p1_build/build_v012/file.txt
          i686-w64-mingw32-objdump -f homelander_p1_build/build_v012/homelander_p1_v012.asi | tee homelander_p1_build/build_v012/headers.txt
          i686-w64-mingw32-objdump -p homelander_p1_build/build_v012/homelander_p1_v012.asi | tee homelander_p1_build/build_v012/imports.txt
          grep -Eiq 'pei-i386|i386' homelander_p1_build/build_v012/headers.txt
          if grep -Eiq 'libstdc\+\+-6\.dll|libgcc_s_.*\.dll|libwinpthread-1\.dll' homelander_p1_build/build_v012/imports.txt; then exit 1; fi
          grep -q 'P1_RuntimeProbe_012_TARGET_CONTINUITY_STAGED_20260919' homelander_p1_build/homelander_p1.cpp

      - name: Validate Lua 5.1
        run: |
          LUAC="$(command -v luac5.1 || command -v luac)"
          "$LUAC" -p homelander_p1_build/lua_p1/target_continuity_probe_v013_STAGED.lua

      - name: Lock upstream mutation/render chain
        run: |
          echo 'b23baf1a08c0358f7eab10f291566f6e26ec9a6cae7bd52fb8415edac6f99350  homelander_p1_build/lua_p1/lasersight_native_gate_v008_STAGED.lua' | sha256sum -c -
          echo '1bf101a352722b809e2137437161ac44e527039f9a4720961d5d058fec7774f2  homelander_p1_build/lua_p1/lasersight_held_gate_v009_STAGED.lua' | sha256sum -c -
          echo '44ea5cdf6f6b0241834f25ec4f66675efa48bfe42a6340cacd6498a9c1f33b01  homelander_p1_build/lua_p1/lasersight_dynamic_aim_gate_v010_STAGED.lua' | sha256sum -c -
          echo '1061aeb0b066c14c06295c48818db3b8b078071c973a6ce6953e1f6d70916cdd  homelander_p1_build/lua_p1/heatvision_damage_gate_v011_STAGED.lua' | sha256sum -c -
          echo '5647a396b03046e537179f1c91a6a8b9373a799618b21c9d3e93cc4e19d3949e  homelander_p1_build/lua_p1/impact_vfx_gate_v012_STAGED.lua' | sha256sum -c -

      - name: Verify F19 native staging bridge
        run: |
          C=homelander_p1_build/homelander_p1.cpp
          grep -q 'g_f19Prev' "$C"
          grep -q 'g_targetContinuityReady' "$C"
          grep -q 'target_continuity_probe_v013_STAGED.lua' "$C"
          grep -q 'RisingEdge(VK_F19, g_f19Prev, inputEnabled)' "$C"
          grep -q 'Homelander_TargetContinuityToggleV013' "$C"
          grep -q 'Homelander_TargetContinuityTickV013' "$C"
          grep -q 'Homelander_TargetContinuityForceDisableV013' "$C"
          grep -q 'F19=read-only target continuity telemetry' "$C"

      - name: Verify health/time ABI proof
        run: |
          A=homelander_p1_build/P1_HEALTH_TIME_ABI_20260919.md
          grep -q 'float go_GetHealth(engine::LuaGOH target)' "$A"
          grep -q 'float go_GetMaxHealth(engine::LuaGOH target)' "$A"
          grep -q 'float time_GetSimulationDelta()' "$A"
          grep -q '0x10856950' "$A"
          grep -q '0x10856A90' "$A"
          grep -q '0x10488FF0' "$A"
          grep -q 'ed0870eb24ace5565a0245ade42114f0724b881d3d75b793f376e9bb184f8d51' "$A"

      - name: Verify continuity semantics
        run: |
          T=homelander_p1_build/lua_p1/target_continuity_probe_v013_STAGED.lua
          grep -q 'HOMELANDER_IMPACT_VFX_SUBMITTED ~= true' "$T"
          grep -q 'local target = HOMELANDER_DAMAGE_LAST_TARGET' "$T"
          grep -q 'pcall(time_GetSimulationDelta)' "$T"
          grep -q 'pcall(go_GetHealth, target)' "$T"
          grep -q 'pcall(go_GetMaxHealth, target)' "$T"
          grep -q 'pcall(fre_LineOfSightTest, start, rayEnd, true, player)' "$T"
          grep -q 'pcall(HL_LastRayHitGOH)' "$T"
          grep -q 'candidate == S.target' "$T"
          grep -q 'S.consecutive >= requiredSeconds and S.consecutive_samples >= requiredSamples' "$T"
          grep -q 'HOMELANDER_TARGET_CONTINUITY_PASSED = true' "$T"

      - name: Verify read-only boundary
        run: |
          T=homelander_p1_build/lua_p1/target_continuity_probe_v013_STAGED.lua
          if grep -Eq 'go_ApplyDamage|go_ApplyDamageAndHit|em_AddWorldEffect|phys_SetLinearVelocity|phys_SetAngularVelocity|go_SetHealth|go_SetMaxHealth|go_Teleport|go_PlayerTeleport|pcall\(ai_Laser|HL_LaserSightSubmitDual' "$T"; then
            echo "Forbidden gameplay mutation/render submit found in F19 read-only probe"
            exit 1
          fi

      - name: Hash build and sources
        run: |
          sha256sum homelander_p1_build/build_v012/homelander_p1_v012.asi | tee homelander_p1_build/build_v012/sha256.txt
          sha256sum homelander_p1_build/lua_p1/target_continuity_probe_v013_STAGED.lua
          sha256sum homelander_p1_build/P1_HEALTH_TIME_ABI_20260919.md
          sha256sum homelander_p1_build/P1_TARGET_CONTINUITY_GATE_20260919.md
          sha256sum homelander_p1_build/homelander_p1.cpp

      - name: Assemble dormant v012 bundle
        run: |
          mkdir -p stage_v012/lua_p1 stage_v012/CI_EVIDENCE
          cp homelander_p1_build/build_v012/homelander_p1_v012.asi stage_v012/
          cp homelander_p1_build/lua_p1/lasersight_native_gate_v008_STAGED.lua stage_v012/lua_p1/
          cp homelander_p1_build/lua_p1/lasersight_held_gate_v009_STAGED.lua stage_v012/lua_p1/
          cp homelander_p1_build/lua_p1/lasersight_dynamic_aim_gate_v010_STAGED.lua stage_v012/lua_p1/
          cp homelander_p1_build/lua_p1/heatvision_damage_gate_v011_STAGED.lua stage_v012/lua_p1/
          cp homelander_p1_build/lua_p1/impact_vfx_gate_v012_STAGED.lua stage_v012/lua_p1/
          cp homelander_p1_build/lua_p1/target_continuity_probe_v013_STAGED.lua stage_v012/lua_p1/
          cp homelander_p1_build/P1_HEALTH_TIME_ABI_20260919.md stage_v012/
          cp homelander_p1_build/P1_TARGET_CONTINUITY_GATE_20260919.md stage_v012/
          cp homelander_p1_build/P1_DAMAGE_AND_HIT_VECTOR_AUDIT_20260919.md stage_v012/
          cp homelander_p1_build/P1_IMPACT_VFX_ABI_20260919.md stage_v012/
          cp homelander_p1_build/P1_IMPACT_VFX_GATE_20260919.md stage_v012/
          cp homelander_p1_build/homelander_p1.cpp stage_v012/homelander_p1_v012_SOURCE.cpp
          cp homelander_p1_build/build_v012/file.txt stage_v012/CI_EVIDENCE/
          cp homelander_p1_build/build_v012/headers.txt stage_v012/CI_EVIDENCE/
          cp homelander_p1_build/build_v012/imports.txt stage_v012/CI_EVIDENCE/
          cp homelander_p1_build/build_v012/sha256.txt stage_v012/CI_EVIDENCE/
          (cd stage_v012 && sha256sum homelander_p1_v012.asi lua_p1/*.lua P1_HEALTH_TIME_ABI_20260919.md P1_TARGET_CONTINUITY_GATE_20260919.md P1_DAMAGE_AND_HIT_VECTOR_AUDIT_20260919.md P1_IMPACT_VFX_ABI_20260919.md P1_IMPACT_VFX_GATE_20260919.md homelander_p1_v012_SOURCE.cpp > SHA256SUMS.txt)
          (cd stage_v012 && sha256sum -c SHA256SUMS.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: Homelander_P1_v012_TargetContinuityGate_DORMANT
          path: stage_v012/
          if-no-files-found: error
