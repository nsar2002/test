name: FLY-MNQ V6-M3F2A official ROI source mapping audit
on:
  push:
    branches: [main]
    paths:
      - 'research/v6_m3f2a_official_roi_source_mapping_protocol.md'
      - 'fly_mnq/v6_m3f2a_official_roi_source_mapping.py'
      - '.github/workflows/fly_mnq_v6_m3f2a_official_roi_mapping.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - name: Install frozen dependencies
        run: |
          python -m pip install --disable-pip-version-check             numpy==2.1.3 pandas==2.2.3 pyarrow==17.0.0 scipy==1.14.1             cloud-volume==12.14.4 requests==2.32.5
      - name: Acquire exact official sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p v6_m3f2a_work v6_m3f2a_out
          curl --fail --location --retry 5 --retry-delay 3 -o v6_m3f2a_work/brain.npz             https://github.com/alextitonis/fly.ai/releases/download/brain-v1/brain.npz
          curl --fail --location --retry 5 --retry-delay 3 -o v6_m3f2a_work/syn-partners.feather             https://storage.googleapis.com/flyem-male-cns/v1.0/connectome-data/flat-connectome/syn-partners-male-cns-v1.0-minconf-0.5.feather
          for body in 10540 10977; do
            curl --fail --location --retry 5 --retry-delay 3 -o "v6_m3f2a_work/$body.swc"               "https://storage.googleapis.com/flyem-male-cns/v1.0/segmentation/skeletons-malecns/skeletons-swc/$body.swc"
          done
          sha256sum v6_m3f2a_work/* | tee v6_m3f2a_out/input_sha256.txt
      - name: Freeze execution bytes
        run: |
          sha256sum research/v6_m3f2a_official_roi_source_mapping_protocol.md             fly_mnq/v6_m3f2a_official_roi_source_mapping.py | tee v6_m3f2a_out/preexecution_sha256.txt
      - name: Execute source-only mapping audit
        shell: bash
        run: |
          set -o pipefail
          python fly_mnq/v6_m3f2a_official_roi_source_mapping.py | tee v6_m3f2a_out/stdout.txt
      - name: Enforce formal classification
        shell: bash
        run: |
          python - <<'PY'
          import json
          r=json.load(open('v6_m3f2a_out/v6_m3f2a_result.json'))
          print('FORMAL_CLASSIFICATION',r['classification'])
          allowed={
            'PASS_M3F2A_OFFICIAL_ROI_SOURCE_MAPPING',
            'FAIL_M3F2A_OFFICIAL_ROI_SOURCE_MAPPING',
            'BLOCKED_M3F2A_ROI_LABEL_METADATA',
            'FAIL_M3F2A_ROI_VOLUME_METADATA',
          }
          if r['classification'] not in allowed:
              raise SystemExit(2)
          PY
      - name: Hash outputs
        if: always()
        shell: bash
        run: |
          : > v6_m3f2a_out/output_sha256.txt
          for f in v6_m3f2a_out/*; do
            [ -f "$f" ] || continue
            [ "$(basename "$f")" = output_sha256.txt ] && continue
            sha256sum "$f" >> v6_m3f2a_out/output_sha256.txt
          done
          cat v6_m3f2a_out/output_sha256.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fly-mnq-v6-m3f2a-official-roi-mapping
          path: v6_m3f2a_out/
          retention-days: 14
