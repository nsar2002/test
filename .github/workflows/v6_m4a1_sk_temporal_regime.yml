name: V6 M4A1 causal SK temporal-regime gate
# trigger revision 2: include frozen M4A1X channel-mapping addendum; no scientific metric-rule change

on:
  push:
    paths:
      - ".github/workflows/v6_m4a1_sk_temporal_regime.yml"
      - "fly_mnq/v6_m4a1_sk_temporal_regime.py"
      - "research/v6_m4a1_sk_temporal_regime_identifiability_protocol.md"
      - "research/v6_m4v0_independent_dsk_validation_reservation.md"
      - "research/v6_m4a1x_multiclamp_channel_mapping_addendum.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install frozen dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            requests==2.32.3 \
            pyabf==2.3.8 \
            numpy==2.1.3 \
            scipy==1.14.1

      - name: Freeze execution bytes
        run: |
          mkdir -p v6_m4a1_out
          sha256sum fly_mnq/v6_m4a1_sk_temporal_regime.py > v6_m4a1_out/preexecution_sha256.txt
          sha256sum research/v6_m4a1_sk_temporal_regime_identifiability_protocol.md >> v6_m4a1_out/preexecution_sha256.txt
          sha256sum research/v6_m4v0_independent_dsk_validation_reservation.md >> v6_m4a1_out/preexecution_sha256.txt
          sha256sum research/v6_m4a1x_multiclamp_channel_mapping_addendum.md >> v6_m4a1_out/preexecution_sha256.txt
          sha256sum research/results/v6_m4a0_chen_ephys_schema_result.json >> v6_m4a1_out/preexecution_sha256.txt
          cat v6_m4a1_out/preexecution_sha256.txt

      - name: Execute frozen M4A1
        run: |
          set -euo pipefail
          python fly_mnq/v6_m4a1_sk_temporal_regime.py | tee v6_m4a1_out/stdout.txt
          mv v6_m4a1_result.json v6_m4a1_out/

      - name: Enforce classification vocabulary
        run: |
          python - <<'PY'
          import json
          r=json.load(open("v6_m4a1_out/v6_m4a1_result.json"))
          allowed={
              "PASS_M4A1_SK_POST_ONLY_IDENTIFIED",
              "PASS_M4A1_SK_DURING_STIMULUS_EFFECT_IDENTIFIED",
              "NO_IDENTIFIABLE_M4A1_SK_TEMPORAL_EFFECT",
              "BLOCKED_M4A1_SOURCE_OR_PROTOCOL_PARITY",
              "BLOCKED_M4A1X_CHANNEL_MAPPING_PARITY",
          }
          print("FORMAL_CLASSIFICATION", r["classification"])
          if r["classification"] not in allowed:
              raise SystemExit(2)
          PY

      - name: Hash outputs
        run: |
          set -euo pipefail
          : > v6_m4a1_out/output_sha256.txt
          for f in v6_m4a1_out/*; do
            [ -f "$f" ] || continue
            [ "$(basename "$f")" = output_sha256.txt ] && continue
            sha256sum "$f" >> v6_m4a1_out/output_sha256.txt
          done
          cat v6_m4a1_out/output_sha256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: fly-mnq-v6-m4a1-sk-temporal-regime
          path: v6_m4a1_out/
          retention-days: 14

      - name: Persist formal result in public source-only repo
        run: |
          set -euo pipefail
          mkdir -p research/results
          cp v6_m4a1_out/v6_m4a1_result.json research/results/v6_m4a1_sk_temporal_regime_result.json
          cp v6_m4a1_out/output_sha256.txt research/results/v6_m4a1_sk_temporal_regime_output_sha256.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/results/v6_m4a1_sk_temporal_regime_result.json research/results/v6_m4a1_sk_temporal_regime_output_sha256.txt
          if git diff --cached --quiet; then
            echo "No result change to commit"
          else
            git commit -m "V6-M4A1: record causal SK temporal-regime result [skip ci]"
            git push
          fi
