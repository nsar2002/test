name: Homelander P1 v016 Effect Catalog CI

on:
  push:
    branches:
      - homelander-p1-v016-effect-catalog-20260919
    paths:
      - 'homelander_p1_build/homelander_p1.cpp'
      - 'homelander_p1_build/lua_p1/vfx_candidate_resolver_v017_STAGED.lua'
      - 'homelander_p1_build/P1_STARTUP_EFFECT_CATALOG_20260919.md'
      - 'homelander_p1_build/P1_VFX_CANDIDATE_GATE_20260919.md'
      - 'homelander_p1_build/V016_REPRO_TRIGGER.txt'
      - '.github/workflows/homelander-p1-v016-effect-catalog-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-static-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Win32 and Lua 5.1 tools
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-mingw-w64-i686 binutils-mingw-w64-i686 lua5.1

      - name: Build v016
        run: |
          mkdir -p homelander_p1_build/build_v016
          i686-w64-mingw32-g++ homelander_p1_build/homelander_p1.cpp \
            -std=gnu++17 -O2 -Wall -Wextra \
            -shared -static-libgcc -static-libstdc++ \
            -Wl,--subsystem,windows \
            -o homelander_p1_build/build_v016/homelander_p1_v016.asi \
            -luser32
          test -s homelander_p1_build/build_v016/homelander_p1_v016.asi

      - name: Verify PE32 imports and build identity
        run: |
          file homelander_p1_build/build_v016/homelander_p1_v016.asi | tee homelander_p1_build/build_v016/file.txt
          i686-w64-mingw32-objdump -f homelander_p1_build/build_v016/homelander_p1_v016.asi | tee homelander_p1_build/build_v016/headers.txt
          i686-w64-mingw32-objdump -p homelander_p1_build/build_v016/homelander_p1_v016.asi | tee homelander_p1_build/build_v016/imports.txt
          grep -Eiq 'pei-i386|i386' homelander_p1_build/build_v016/headers.txt
          if grep -Eiq 'libstdc\+\+-6\.dll|libgcc_s_.*\.dll|libwinpthread-1\.dll' homelander_p1_build/build_v016/imports.txt; then exit 1; fi
          grep -q 'P1_RuntimeProbe_016_EFFECT_CATALOG_STAGED_20260919' homelander_p1_build/homelander_p1.cpp

      - name: Validate Lua 5.1
        run: |
          LUAC="$(command -v luac5.1 || command -v luac)"
          "$LUAC" -p homelander_p1_build/lua_p1/vfx_candidate_resolver_v017_STAGED.lua

      - name: Lock upstream chain through F22
        run: |
          echo 'b23baf1a08c0358f7eab10f291566f6e26ec9a6cae7bd52fb8415edac6f99350  homelander_p1_build/lua_p1/lasersight_native_gate_v008_STAGED.lua' | sha256sum -c -
          echo '1bf101a352722b809e2137437161ac44e527039f9a4720961d5d058fec7774f2  homelander_p1_build/lua_p1/lasersight_held_gate_v009_STAGED.lua' | sha256sum -c -
          echo '44ea5cdf6f6b0241834f25ec4f66675efa48bfe42a6340cacd6498a9c1f33b01  homelander_p1_build/lua_p1/lasersight_dynamic_aim_gate_v010_STAGED.lua' | sha256sum -c -
          echo '1061aeb0b066c14c06295c48818db3b8b078071c973a6ce6953e1f6d70916cdd  homelander_p1_build/lua_p1/heatvision_damage_gate_v011_STAGED.lua' | sha256sum -c -
          echo '5647a396b03046e537179f1c91a6a8b9373a799618b21c9d3e93cc4e19d3949e  homelander_p1_build/lua_p1/impact_vfx_gate_v012_STAGED.lua' | sha256sum -c -
          echo 'f29934a16e20b88cbdfa82ce14b722700914e01fd7f5595dc551a144b6511ccc  homelander_p1_build/lua_p1/target_continuity_probe_v013_STAGED.lua' | sha256sum -c -
          echo '07e996ce56d8a3440fe25fcd8038801337e8278b04b53c41b5834bf52bdce888  homelander_p1_build/lua_p1/dot_dryrun_scheduler_v014_STAGED.lua' | sha256sum -c -
          echo '9c58fe1880788c430dfb56d984444dde8c2e6d4f299d8ceaa6a070d3d7c78506  homelander_p1_build/lua_p1/damagehit_payload_probe_v015_STAGED.lua' | sha256sum -c -
          echo '8c4df0ac2ecd0b3bed4da3bbf4aca9ba3ccf11213d5f7c109a0f9f63953975ff  homelander_p1_build/lua_p1/target_vfx_route_probe_v016_STAGED.lua' | sha256sum -c -

      - name: Verify F23 native bridge
        run: |
          C=homelander_p1_build/homelander_p1.cpp
          grep -q 'g_f23Prev' "$C"
          grep -q 'g_vfxCandidateReady' "$C"
          grep -q 'vfx_candidate_resolver_v017_STAGED.lua' "$C"
          grep -q 'RisingEdge(VK_F23, g_f23Prev, inputEnabled)' "$C"
          grep -q 'Homelander_VFXCandidateResolveV017' "$C"

      - name: Verify exact asset audit
        run: |
          A=homelander_p1_build/P1_STARTUP_EFFECT_CATALOG_20260919.md
          grep -q '38bd7664d5b709d8d9a2fc07e3a68dffbca75a9871e5ae0c2cf1cab0fd7ba94e' "$A"
          grep -q '7359617402d7f9da2475f69d841e8b341e3b9cf45e9eea88fcd76e559ab37230' "$A"
          grep -q 'top-level effect-object chunks of type `0x23000`: 131' "$A"
          grep -q '`squibBlood001`' "$A"
          grep -q '`squibMetal001`' "$A"
          grep -q '`goreBloodMistFanOut001`' "$A"
          grep -q '`debrisSparks001`' "$A"
          grep -q '`missileImpact001`' "$A"
          grep -q 'fire_scorch.*NOT a top-level' "$A"

      - name: Verify candidate route semantics
        run: |
          P=homelander_p1_build/lua_p1/vfx_candidate_resolver_v017_STAGED.lua
          grep -q 'HOMELANDER_TARGET_CLASSIFICATION_PASSED ~= true' "$P"
          grep -q 'HOMELANDER_DAMAGEHIT_PAYLOAD_TARGET ~= target' "$P"
          grep -q 'primary = "squibMetal001"' "$P"
          grep -q 'secondary = "debrisSparks001"' "$P"
          grep -q 'primary = "squibBlood001"' "$P"
          grep -q 'secondary = "goreBloodMistFanOut001"' "$P"
          grep -q 'fallback = "missileImpact001"' "$P"
          grep -q 'HOMELANDER_VFX_CANDIDATE_STATIC_PROVEN = true' "$P"
          grep -q 'HOMELANDER_VFX_CANDIDATE_RUNTIME_PROVEN = false' "$P"

      - name: Verify strict read-only boundary
        run: |
          P=homelander_p1_build/lua_p1/vfx_candidate_resolver_v017_STAGED.lua
          if grep -Eq 'go_ApplyDamage\(|go_ApplyDamageAndHit\(|em_AddWorldEffect|go_SetHealth|go_SetMaxHealth|phys_SetLinearVelocity|phys_SetAngularVelocity|go_Teleport|go_PlayerTeleport|pcall\(ai_Laser|HL_LaserSightSubmitDual' "$P"; then
            echo "Forbidden mutation/render call in F23 resolver"
            exit 1
          fi
          if grep -q 'fire_scorch' "$P"; then
            echo "fire_scorch must not enter the world-effect allowlist"
            exit 1
          fi

      - name: Hash build and sources
        run: |
          sha256sum homelander_p1_build/build_v016/homelander_p1_v016.asi | tee homelander_p1_build/build_v016/sha256.txt
          sha256sum homelander_p1_build/lua_p1/vfx_candidate_resolver_v017_STAGED.lua
          sha256sum homelander_p1_build/P1_STARTUP_EFFECT_CATALOG_20260919.md
          sha256sum homelander_p1_build/P1_VFX_CANDIDATE_GATE_20260919.md
          sha256sum homelander_p1_build/homelander_p1.cpp

      - name: Assemble dormant v016 bundle
        run: |
          mkdir -p stage_v016/lua_p1 stage_v016/CI_EVIDENCE
          cp homelander_p1_build/build_v016/homelander_p1_v016.asi stage_v016/
          cp homelander_p1_build/lua_p1/lasersight_native_gate_v008_STAGED.lua stage_v016/lua_p1/
          cp homelander_p1_build/lua_p1/lasersight_held_gate_v009_STAGED.lua stage_v016/lua_p1/
          cp homelander_p1_build/lua_p1/lasersight_dynamic_aim_gate_v010_STAGED.lua stage_v016/lua_p1/
          cp homelander_p1_build/lua_p1/heatvision_damage_gate_v011_STAGED.lua stage_v016/lua_p1/
          cp homelander_p1_build/lua_p1/impact_vfx_gate_v012_STAGED.lua stage_v016/lua_p1/
          cp homelander_p1_build/lua_p1/target_continuity_probe_v013_STAGED.lua stage_v016/lua_p1/
          cp homelander_p1_build/lua_p1/dot_dryrun_scheduler_v014_STAGED.lua stage_v016/lua_p1/
          cp homelander_p1_build/lua_p1/damagehit_payload_probe_v015_STAGED.lua stage_v016/lua_p1/
          cp homelander_p1_build/lua_p1/target_vfx_route_probe_v016_STAGED.lua stage_v016/lua_p1/
          cp homelander_p1_build/lua_p1/vfx_candidate_resolver_v017_STAGED.lua stage_v016/lua_p1/
          cp homelander_p1_build/P1_STARTUP_EFFECT_CATALOG_20260919.md stage_v016/
          cp homelander_p1_build/P1_VFX_CANDIDATE_GATE_20260919.md stage_v016/
          cp homelander_p1_build/P1_TARGET_VFX_ROUTE_GATE_20260919.md stage_v016/
          cp homelander_p1_build/P1_DAMAGEHIT_PAYLOAD_GATE_20260919.md stage_v016/
          cp homelander_p1_build/P1_DAMAGE_AND_HIT_VECTOR_AUDIT_20260919.md stage_v016/
          cp homelander_p1_build/homelander_p1.cpp stage_v016/homelander_p1_v016_SOURCE.cpp
          cp homelander_p1_build/build_v016/file.txt stage_v016/CI_EVIDENCE/
          cp homelander_p1_build/build_v016/headers.txt stage_v016/CI_EVIDENCE/
          cp homelander_p1_build/build_v016/imports.txt stage_v016/CI_EVIDENCE/
          cp homelander_p1_build/build_v016/sha256.txt stage_v016/CI_EVIDENCE/
          (cd stage_v016 && sha256sum homelander_p1_v016.asi lua_p1/*.lua P1_STARTUP_EFFECT_CATALOG_20260919.md P1_VFX_CANDIDATE_GATE_20260919.md P1_TARGET_VFX_ROUTE_GATE_20260919.md P1_DAMAGEHIT_PAYLOAD_GATE_20260919.md P1_DAMAGE_AND_HIT_VECTOR_AUDIT_20260919.md homelander_p1_v016_SOURCE.cpp > SHA256SUMS.txt)
          (cd stage_v016 && sha256sum -c SHA256SUMS.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: Homelander_P1_v016_EffectCatalogGate_DORMANT
          path: stage_v016/
          if-no-files-found: error
