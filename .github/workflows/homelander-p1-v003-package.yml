name: Homelander P1 v003 Transfer Package

on:
  pull_request:
    branches:
      - homelander-p1-v003-ci-base-20260918
    paths:
      - 'homelander_p1_build/v003_transfer/**'
      - 'homelander_p1_build/V003_PACKAGE_TRIGGER.txt'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  package-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download exact verified v003 ASI artifact
        uses: actions/download-artifact@v4
        with:
          name: homelander-p1-v003-win32
          path: exact_ci
          github-token: ${{ github.token }}
          run-id: 35392791144

      - name: Verify exact ASI and transfer source hashes
        run: |
          echo "1845aff900e77f7c98e1ef0b37a2ea83c1c293ad74d01dc8fb136a198c9027c2  exact_ci/homelander_p1.asi" | sha256sum -c -
          cd homelander_p1_build/v003_transfer/lua_p1
          cat > /tmp/lua.sha256 <<'EOF'
bd7a6ec2006466b0f7b46f966f384103d35d5d98020bcdce1112e9b4f363a650  runtime_probe.lua
ef6857400cceea36278514c5808ee8290fb15daf5827be3df35eb05ba5aa7b81  setter_echo_probe.lua
033bafec3a64f6e5c9466481d896eed35a67206703bf09be4054369e35150fa9  flight_math_probe.lua
4d84d44f39b2bb0cef7ae4513bf73f17eac717c80c80eb3263616207485f577b  flight_controller_v1.lua
914a6631f9e1e5c90fff8faf335443211b990000b985134f32b7b2d1633a2f51  heatvision_probe.lua
89885eecdf1dcd1f324c6cd3c3580013674639167e0849688ed7036c75678cd1  freeaim_probe_v004_STAGED.lua
EOF
          sha256sum -c /tmp/lua.sha256

      - name: Validate PowerShell syntax
        shell: pwsh
        run: |
          $files = @(
            "homelander_p1_build/v003_transfer/INSTALL_V003_FREEAIM_GATE.ps1",
            "homelander_p1_build/v003_transfer/ROLLBACK_V003_TO_V001.ps1",
            "homelander_p1_build/v003_transfer/CHECK_V003_GATE.ps1"
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_.Message }
              exit 1
            }
          }

      - name: Validate Lua 5.1 syntax
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1
          LUAC="$(command -v luac5.1 || command -v luac)"
          test -n "$LUAC"
          for f in homelander_p1_build/v003_transfer/lua_p1/*.lua; do
            "$LUAC" -p "$f"
          done

      - name: Assemble transfer package
        run: |
          mkdir -p package/payload/lua_p1 package/CI_EVIDENCE
          cp exact_ci/homelander_p1.asi package/payload/homelander_p1.asi
          cp homelander_p1_build/v003_transfer/lua_p1/*.lua package/payload/lua_p1/
          cp homelander_p1_build/v003_transfer/INSTALL_V003_FREEAIM_GATE.ps1 package/
          cp homelander_p1_build/v003_transfer/ROLLBACK_V003_TO_V001.ps1 package/
          cp homelander_p1_build/v003_transfer/CHECK_V003_GATE.ps1 package/
          cp homelander_p1_build/v003_transfer/README_FIRST_V003_TEST.txt package/
          cp exact_ci/file.txt package/CI_EVIDENCE/
          cp exact_ci/headers.txt package/CI_EVIDENCE/
          cp exact_ci/imports.txt package/CI_EVIDENCE/
          cp exact_ci/sha256.txt package/CI_EVIDENCE/
          cat > package/PACKAGE_METADATA.txt <<'EOF'
Homelander P1 v003 FreeAimGate transfer
Exact ASI source workflow run: 35392791144
Exact ASI workflow artifact: 10567040283
Exact ASI SHA256: 1845aff900e77f7c98e1ef0b37a2ea83c1c293ad74d01dc8fb136a198c9027c2
Build ID: P1_RuntimeProbe_003_FREEAIM_STAGED_20260918
F9 safety: READ ONLY
Promotion source state: confirmed v001 only
EOF
          (
            cd package
            sha256sum payload/homelander_p1.asi payload/lua_p1/*.lua               INSTALL_V003_FREEAIM_GATE.ps1 ROLLBACK_V003_TO_V001.ps1               CHECK_V003_GATE.ps1 README_FIRST_V003_TEST.txt > SHA256SUMS.txt
          )

      - name: Final package verification
        run: |
          (cd package && sha256sum -c SHA256SUMS.txt)
          test -s package/payload/homelander_p1.asi
          test -s package/payload/lua_p1/freeaim_probe_v004_STAGED.lua

      - uses: actions/upload-artifact@v4
        with:
          name: Homelander_P1_v003_FreeAimGate_Transfer
          path: package/
          if-no-files-found: error
