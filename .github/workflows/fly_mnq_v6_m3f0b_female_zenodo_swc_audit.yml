name: FLY-MNQ V6-M3F0B female Zenodo SWC audit
on:
  push:
    branches: [main]
    paths:
      - 'research/v6_m3f0b_female_flywire_zenodo_swc_protocol.md'
      - 'fly_mnq/v6_m3f0b_female_zenodo_swc_audit.py'
      - '.github/workflows/fly_mnq_v6_m3f0b_female_zenodo_swc_audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - name: Install frozen dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.1.3 pandas==2.2.3 pyarrow==17.0.0 scipy==1.14.1
      - name: Check runner storage
        run: df -h .
      - name: Acquire exact Zenodo v2 skeleton library
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p v6_m3f0b_work v6_m3f0b_out
          curl --fail --location --retry 5 --retry-delay 10 --connect-timeout 60 --max-time 2400             -o v6_m3f0b_work/sk_lod1_783_healed_ds2.parquet             'https://zenodo.org/records/10877326/files/sk_lod1_783_healed_ds2.parquet?download=1'
          echo 'a4c104776f33ec539ef859064c4de3df  v6_m3f0b_work/sk_lod1_783_healed_ds2.parquet' | md5sum -c -
          md5sum v6_m3f0b_work/sk_lod1_783_healed_ds2.parquet | tee v6_m3f0b_out/source_md5.txt
          sha256sum v6_m3f0b_work/sk_lod1_783_healed_ds2.parquet | tee v6_m3f0b_out/source_sha256.txt
          stat -c '%s' v6_m3f0b_work/sk_lod1_783_healed_ds2.parquet | tee v6_m3f0b_out/source_bytes.txt
      - name: Freeze execution bytes
        shell: bash
        run: |
          set -euo pipefail
          sha256sum research/v6_m3f0b_female_flywire_zenodo_swc_protocol.md fly_mnq/v6_m3f0b_female_zenodo_swc_audit.py | tee v6_m3f0b_out/preexecution_sha256.txt
      - name: Execute exact-root schema and cable-geometry audit
        shell: bash
        run: |
          set -o pipefail
          python fly_mnq/v6_m3f0b_female_zenodo_swc_audit.py | tee v6_m3f0b_out/stdout.txt
      - name: Enforce formal source classification
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          r=json.load(open('v6_m3f0b_out/v6_m3f0b_result.json'))
          print('FORMAL_CLASSIFICATION',r['classification'])
          ok={'PASS_M3F0B_FEMALE_ZENODO_SWC_CABLE_GEOMETRY',
              'FAIL_M3F0B_FEMALE_ZENODO_SWC_CABLE_GEOMETRY',
              'BLOCKED_M3F0B_ZENODO_SWC_SCHEMA'}
          if r['classification'] not in ok:
              raise SystemExit(2)
          PY
      - name: Hash outputs
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          : > v6_m3f0b_out/output_sha256.txt
          for f in v6_m3f0b_out/*; do
            [ -f "$f" ] || continue
            [ "$(basename "$f")" = output_sha256.txt ] && continue
            sha256sum "$f" >> v6_m3f0b_out/output_sha256.txt
          done
          cat v6_m3f0b_out/output_sha256.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fly-mnq-v6-m3f0b-female-zenodo-swc
          path: v6_m3f0b_out/
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
