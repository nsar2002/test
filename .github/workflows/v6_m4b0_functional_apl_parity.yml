name: V6 M4B0 functional APL parity

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v6_m4b0_functional_apl_parity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.1.3 pandas==2.2.3 pyarrow==17.0.0
      - name: Acquire exact annotation source
        run: |
          set -euo pipefail
          mkdir -p v6_m4b0_work v6_m4b0_out
          curl --fail --location --retry 5 --retry-delay 5 -o v6_m4b0_work/body-annotations.feather https://storage.googleapis.com/flyem-male-cns/v1.0/connectome-data/flat-connectome/body-annotations-male-cns-v1.0-minconf-0.5.feather
          echo '2177e246113e4cfbf1e7772ec37c6da1955ff22e8063d0b1f833101f99a9a3b2  v6_m4b0_work/body-annotations.feather' | sha256sum -c -
      - name: Freeze execution bytes
        run: |
          sha256sum research/v6_m4b0_functional_apl_abstraction_protocol.md fly_mnq/v6_m4b0_functional_apl_sparsifier.py research/v6_m5b1_exact_learner_identity_result.md | tee v6_m4b0_out/preexecution_sha256.txt
      - name: Execute frozen no-market parity
        run: python fly_mnq/v6_m4b0_functional_apl_sparsifier.py | tee v6_m4b0_out/stdout.txt
      - name: Enforce PASS
        run: |
          python - <<'PY'
          import json
          r=json.load(open('v6_m4b0_out/v6_m4b0_functional_apl_result.json'))
          print('FORMAL_CLASSIFICATION',r['classification'])
          if r['classification']!='PASS_M4B0_FUNCTIONAL_APL_ABSTRACTION_UNIT_PARITY':
              raise SystemExit(2)
          PY
      - name: Hash outputs
        if: always()
        run: sha256sum v6_m4b0_out/v6_m4b0_functional_apl_result.json v6_m4b0_out/stdout.txt v6_m4b0_out/preexecution_sha256.txt | tee v6_m4b0_out/output_sha256.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fly-mnq-v6-m4b0-functional-apl-parity
          path: v6_m4b0_out/
          retention-days: 14
          compression-level: 0
