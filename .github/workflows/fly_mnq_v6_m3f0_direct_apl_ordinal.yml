name: FLY-MNQ V6-M3F0 direct APL ordinal eligibility
on:
  push:
    branches: [main]
    paths:
      - 'research/v6_m3f0_direct_apl_ordinal_eligibility_protocol.md'
      - 'fly_mnq/v6_m3f0_direct_apl_ordinal_eligibility.py'
      - '.github/workflows/fly_mnq_v6_m3f0_direct_apl_ordinal.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  eligibility:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - run: python -m pip install --disable-pip-version-check numpy==2.1.3 pandas==2.2.3 pyarrow==17.0.0 scipy==1.14.1
      - name: Acquire exact official sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p v6_m3f0_work v6_m3f0_out
          curl --fail --location --retry 5 --retry-delay 3 -o v6_m3f0_work/brain.npz             https://github.com/alextitonis/fly.ai/releases/download/brain-v1/brain.npz
          curl --fail --location --retry 5 --retry-delay 3 -o v6_m3f0_work/syn-partners.feather             https://storage.googleapis.com/flyem-male-cns/v1.0/connectome-data/flat-connectome/syn-partners-male-cns-v1.0-minconf-0.5.feather
          for body in 10540 10977; do
            curl --fail --location --retry 5 --retry-delay 3 -o "v6_m3f0_work/$body.swc"               "https://storage.googleapis.com/flyem-male-cns/v1.0/segmentation/skeletons-malecns/skeletons-swc/$body.swc"
          done
          sha256sum v6_m3f0_work/* | tee v6_m3f0_out/input_sha256.txt
      - name: Freeze execution bytes
        run: sha256sum research/v6_m3f0_direct_apl_ordinal_eligibility_protocol.md fly_mnq/v6_m3f0_direct_apl_ordinal_eligibility.py | tee v6_m3f0_out/preexecution_sha256.txt
      - name: Execute source-only eligibility
        shell: bash
        run: |
          set -o pipefail
          python fly_mnq/v6_m3f0_direct_apl_ordinal_eligibility.py | tee v6_m3f0_out/stdout.txt
      - name: Enforce formal classification
        shell: bash
        run: |
          python - <<'PY'
          import json
          r=json.load(open('v6_m3f0_out/v6_m3f0_result.json'))
          print('FORMAL_CLASSIFICATION',r['classification'])
          ok={'PASS_M3F0_HV_DIRECT_STIM_ORDINAL_PREDICTION_ELIGIBLE',
              'NO_ROBUST_M3F0_HV_DIRECT_STIM_ORDINAL_PREDICTION'}
          if r['classification'] not in ok:
              raise SystemExit(2)
          PY
      - name: Hash outputs
        if: always()
        shell: bash
        run: |
          : > v6_m3f0_out/output_sha256.txt
          for f in v6_m3f0_out/*; do
            [ -f "$f" ] || continue
            [ "$(basename "$f")" = output_sha256.txt ] && continue
            sha256sum "$f" >> v6_m3f0_out/output_sha256.txt
          done
          cat v6_m3f0_out/output_sha256.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fly-mnq-v6-m3f0-direct-apl-ordinal
          path: v6_m3f0_out/
          retention-days: 14
