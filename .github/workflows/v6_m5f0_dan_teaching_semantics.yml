name: V6 M5F0 DAN teaching semantics

on:
  push:
    branches: [claude/hello-8eabhu]
    paths:
      - ".github/workflows/v6_m5f0_dan_teaching_semantics.yml"
      - "fly_mnq/v6_m5f0_dan_teaching_semantics.py"
      - "research/v6_m5f0_dan_teaching_semantics_protocol.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"

      - name: Install pinned dependencies
        run: |
          python -m pip install --disable-pip-version-check numpy==2.1.3 pandas==2.2.3 pyarrow==17.0.0 scipy==1.14.1

      - name: Acquire pinned MaleCNS sources
        run: |
          set -euo pipefail
          mkdir -p v6_m5b3b_work v6_m5b3b_out v6_m5f0_out
          curl --fail --location --retry 5 --retry-delay 5 \
            -o v6_m5b3b_work/body-annotations.feather \
            https://storage.googleapis.com/flyem-male-cns/v1.0/connectome-data/flat-connectome/body-annotations-male-cns-v1.0-minconf-0.5.feather
          curl --fail --location --retry 5 --retry-delay 5 \
            -o v6_m5b3b_work/connectome-weights.feather \
            https://storage.googleapis.com/flyem-male-cns/v1.0/connectome-data/flat-connectome/connectome-weights-male-cns-v1.0-minconf-0.5.feather
          echo '2177e246113e4cfbf1e7772ec37c6da1955ff22e8063d0b1f833101f99a9a3b2  v6_m5b3b_work/body-annotations.feather' | sha256sum -c -
          echo 'e35da783d1c686b2b58b3b87cd6a403ae43bfcfba8bff28e08ef752c1a56afc1  v6_m5b3b_work/connectome-weights.feather' | sha256sum -c -

      - name: Freeze execution bytes
        run: |
          sha256sum \
            research/v6_m5f0_dan_teaching_semantics_protocol.md \
            fly_mnq/v6_m5f0_dan_teaching_semantics.py \
            fly_mnq/v6_m5c_dopamine_gated_plasticity_chronology.py \
            fly_mnq/v6_m5d0_mbon_readout_conditioning.py \
            fly_mnq/v6_m5e0_sensory_kc_encoder.py \
            fly_mnq/v6_m5b3b_compartment_gating_mvp.py \
            fly_mnq/v6_m4b0_functional_apl_sparsifier.py \
            research/results/v6_m5c_plasticity_chronology_result.json \
            research/results/v6_m5d0_mbon_readout_conditioning_result.json \
            research/results/v6_m5e0_encoder_result.json \
            research/results/v6_m5e0_wiring.npz \
            research/results/v6_m5d1b_valence_extension_result.json \
            research/v6_m5d1c_type_number_bridge_result.md \
            | tee v6_m5f0_out/preexecution_sha256.txt

      - name: Re-execute frozen M5B3B unchanged (parity prerequisite)
        run: |
          set -euo pipefail
          python fly_mnq/v6_m5b3b_compartment_gating_mvp.py > v6_m5f0_out/m5b3b_rerun_stdout.txt
          sha256sum v6_m5b3b_out/* | tee v6_m5f0_out/m5b3b_rerun_sha256.txt

      - name: Execute frozen M5F0 teaching-semantics qualification
        run: |
          set -euo pipefail
          python fly_mnq/v6_m5f0_dan_teaching_semantics.py | tee v6_m5f0_out/stdout.txt

      - name: Enforce classification vocabulary
        run: |
          python - <<'PY'
          import json
          r=json.load(open("v6_m5f0_out/v6_m5f0_teaching_result.json"))
          allowed={
            "PASS_M5F0_TEACHING_SEMANTICS_QUALIFIED",
            "FAIL_M5F0_TEACHING_SEMANTICS",
            "BLOCKED_M5F0_PREREQUISITE_PARITY",
          }
          print("FORMAL_CLASSIFICATION",r["classification"])
          if r["classification"] not in allowed:
              raise SystemExit(2)
          PY

      - name: Hash outputs
        if: always()
        run: |
          set -euo pipefail
          : > v6_m5f0_out/output_sha256.txt
          for f in v6_m5f0_out/*; do
            [ -f "$f" ] || continue
            [ "$(basename "$f")" = output_sha256.txt ] && continue
            sha256sum "$f" >> v6_m5f0_out/output_sha256.txt
          done
          cat v6_m5f0_out/output_sha256.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fly-mnq-v6-m5f0-dan-teaching-semantics
          path: v6_m5f0_out/
          retention-days: 14
          compression-level: 0

      - name: Persist formal summary result
        if: success()
        run: |
          set -euo pipefail
          mkdir -p research/results
          cp v6_m5f0_out/v6_m5f0_teaching_result.json research/results/v6_m5f0_teaching_result.json
          cp v6_m5f0_out/output_sha256.txt research/results/v6_m5f0_teaching_output_sha256.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/results/v6_m5f0_teaching_result.json research/results/v6_m5f0_teaching_output_sha256.txt
          if git diff --cached --quiet; then
            echo "No result change"
          else
            git commit -m "V6-M5F0: record DAN teaching semantics result [skip ci]"
            git push
          fi
